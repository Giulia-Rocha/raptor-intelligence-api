spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/raptor_intelligence}
    username: ${SPRING_DATASOURCE_USERNAME:raptor}
    password: ${SPRING_DATASOURCE_PASSWORD:raptor123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate

    show-sql: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

jwt:
  # Segredo injetado por variável de ambiente (ver docker-compose.yml).
  # O default abaixo é apenas para desenvolvimento local.
  secret: ${JWT_SECRET:sua-chave-secreta-256bits-aqui-trocar-em-producao}
  expiration: ${JWT_EXPIRATION:86400000} # ms -> 24h

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs